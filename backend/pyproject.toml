[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footage2robot"
version = "0.1.0"
description = "Turn videos of people doing tasks into robot-learning datasets."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "mediapipe>=0.10.14",
  "pyarrow>=14",
  "h5py>=3.9",
  "zarr>=2.16",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
  "pandas>=2.0",
  "google-auth>=2.20",
  "cryptography>=41",
  "requests>=2.31",
]

[project.optional-dependencies]
rlds = ["tensorflow-cpu>=2.15", "tensorflow-datasets>=4.9"]
sam2 = ["sam2>=1.0", "torch>=2.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
footage2robot = "footage2robot.cli:main"

[tool.setuptools.packages.find]
include = ["footage2robot*"]

[tool.setuptools.package-data]
footage2robot = ["robots/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
